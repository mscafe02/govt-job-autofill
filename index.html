<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Govt Job AutoFill Pro</title>
<style>
body{font-family:Arial;background:#f1f5f9;margin:0;padding:16px}
header{background:#123b70;color:white;padding:20px;text-align:center;border-radius:12px}
.card{background:white;padding:18px;margin-top:16px;border-radius:12px}
input,button{width:100%;padding:12px;margin:8px 0;box-sizing:border-box}
input{border:1px solid #bbb;border-radius:7px}
button{background:#123b70;color:white;border:0;border-radius:7px;font-size:16px}
pre{white-space:pre-wrap;overflow-wrap:anywhere}
</style>
</head>
<body>

<header>
<h2>Govt Job AutoFill Pro</h2>
<p>Your Documents • Your Control</p>
</header>

<div class="card">
<h3>Candidate Profile</h3>
<input id="name" placeholder="Full Name">
<input id="father" placeholder="Father Name">
<input id="dob" type="date">
<input id="mobile" placeholder="Mobile Number">
<input id="email" type="email" placeholder="Email">
<input id="category" placeholder="Category">
<input id="qualification" placeholder="Qualification">
<button onclick="save()">Save / Update Profile</button>
<p id="status">Checking saved profile...</p>
</div>

<div class="card">
<h3>Upload Documents</h3>
<input type="file" id="documents" multiple>
<p id="files">No files selected</p>
</div>

<div class="card">
<h3>Government Job Form</h3>
<input id="job" placeholder="Enter Job Name">
<button onclick="prepare()">Prepare Details</button>
<pre id="result"></pre>
</div>

<div class="card">
<h3>Final Submission Control</h3>
<p>Automatic submission: OFF</p>
<button disabled>Auto Submit Disabled</button>
</div>

<script>
const ids=["name","father","dob","mobile","email","category","qualification"];
const KEY="candidateProfile";

function save(){
 try{
  let data={};
  ids.forEach(id=>{
   data[id]=document.getElementById(id).value;
  });
  localStorage.setItem(KEY,JSON.stringify(data));

  let check=localStorage.getItem(KEY);
  if(!check) throw new Error("Save verification failed");

  document.getElementById("status").textContent="Profile saved successfully!";
 }catch(error){
  document.getElementById("status").textContent=
  "Save error: "+error.message;
 }
}

function load(){
 try{
  const saved=localStorage.getItem(KEY);
  if(!saved){
   document.getElementById("status").textContent="Profile not saved yet";
   return;
  }

  const data=JSON.parse(saved);
  ids.forEach(id=>{
   document.getElementById(id).value=data[id]||"";
  });

  document.getElementById("status").textContent="Saved profile loaded!";
 }catch(error){
  document.getElementById("status").textContent=
  "Load error: "+error.message;
 }
}

function prepare(){
 let data={};
 ids.forEach(id=>{
  data[id]=document.getElementById(id).value;
 });
 document.getElementById("result").textContent=
 JSON.stringify({job:document.getElementById("job").value,details:data},null,2);
}

document.getElementById("documents").onchange=function(){
 document.getElementById("files").textContent=
 this.files.length+" files selected (not uploaded or saved)";
};

load();
</script>
</body>
</html>
